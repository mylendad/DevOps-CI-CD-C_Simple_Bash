stages:
  - format
  - build
  - test

check_clang_format:
  stage: format
  script:
    - cp ../materials/linters/.clang-format ./
    - >
      FORMAT_DIFF=$(find src/ -name "*.c" -o -name "*.h" | xargs clang-format -style=file -output-replacements-xml |
      grep -c "<replacement ")
    - >
      if [ "$FORMAT_DIFF" -ne 0 ]; then
        find src/ -name "*.c" -o -name "*.h" | while read file; do
          echo "▶ $file"
          diff -u "$file" <(clang-format -style=file "$file")
        done
        exit 1
      else
        echo "SUCCES!"
      fi

build_project:
  stage: build
  script:
    - cd src
    - make
  artifacts:
    name: "build-artifacts"
    paths:
      - src/build/       
    expire_in: 30 days

test_project:
  stage: testing
  script:
    - chmod +x tests.sh
		- ./tests.sh
  artifacts:
    name: "build-artifacts"
    paths:
      - src/build/       
    expire_in: 30 days

integration_tests:
  stage: test
  script:
    - chmod +x tests/tests.sh
    - ./tests/tests.sh
  when: on_success 
  allow_failure: false
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        echo "TEST: SUCCES!"
      else
        echo "TEST: FAIL!"
      fi

deploy_project:
  stage: deploy
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  when: manual
  allow_failure: false
  dependencies:
    - build_project      
  artifacts:
    paths:
      - src/build/