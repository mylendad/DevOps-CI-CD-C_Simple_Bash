stages:
  - format
  - build
  - tests
  - deploy

format_project:
  stage: format
  script:
    - chmod +x ./format.sh
    - ./format.sh

build_project:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq make gcc
  script:
    - cd src && make
  artifacts:
    paths:
      - src/build/       
    expire_in: 30 days

tests_project:
  stage: tests
  script:
    - chmod +x src/tests/tests.sh
    - cd src/tests && ./tests.sh
  when: on_success 
  allow_failure: false
  after_script:
    - if [ "$CI_JOB_STATUS" != "SUCCESS!!!" ]; then echo "FAIL!"; fi

deploy_project:
  stage: deploy
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - ssh-keyscan -t rsa 10.0.2.15 >> ~/.ssh/known_hosts
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/*
  script:
    - ls -la ~/.ssh
    - cat ~/.ssh/known_hosts 
    - chmod +x deploy.sh
    - ./deploy.sh
  when: manual
  allow_failure: false