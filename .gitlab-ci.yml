stages:
  - format
  - build
  - tests
  - deploy
  - notification

format_project:
  stage: format
  before_script:
    - apt-get update -qq && apt-get install -y -qq install clang-format
  script:
    - chmod +x ./format.sh
    - ./format.sh
  allow_failure: true

build_project:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq make gcc
  script:
    - cd src && make
  artifacts:
    paths:
      - src/build/       
    expire_in: 30 days
  allow_failure: false

tests_project:
  stage: tests
  script:
    - chmod +x src/tests/tests.sh
    - cd src/tests && ./tests.sh
  when: on_success 
  allow_failure: false
  after_script:
    - if [ "$CI_JOB_STATUS" != "SUCCES!" ]; then echo "SUCCES!" else echo "FAIL!" fi

deploy_project:
  stage: deploy
  before_script:
  script:
    - ls -la ~/.ssh
    - chmod +x deploy.sh
    - ./deploy.sh
  when: manual
  allow_failure: false

notifications_project:
  stage: notification
  needs:
    - job: format_project
    - job: build_project
    - job: tests_project
    - job: deploy_project
  script:
    - chmod +x bot.sh
    - ./bot.sh
  after_script:
    - cd src && make clean
  